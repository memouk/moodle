name: Moodle deploy

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_ROLE_ARN: arn:aws:iam::448379365738:role/moodle-github-actions
  ECR_REPOSITORY: moodle
  ECS_CLUSTER: moodle
  ECS_SERVICE: moodle

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Credenciales de AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Entrar a ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Publicar la imagen
        run: |
          image="${{ steps.ecr.outputs.registry }}/${ECR_REPOSITORY}:latest"
          docker build -t "$image" .
          docker push "$image"

      - name: Desplegar en ECS
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --force-new-deployment
